<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
        }

        .cursor {
            width: 16px;
            height: 24px;
            position: absolute;
            /* so it can be positioned freely */
            pointer-events: none;
            /* so it doesn't block clicks */
        }
    </style>
</head>

<body>
    <template id='cursor'>
        <svg viewBox='0 0 16.3 24.7' class='cursor'>
            <path stroke='#000' stroke-linecap='round' stroke- linejoin='round' stroke-miterlimit='10' d='M15.6 15.6L.6.6v20.5l4.6-4.5 3.2 7.5
3.4-1.3-3-7.2z' />
        </svg>
    </template>
    <script>
        (async function () {
            const ws = await connectToServer();
            document.body.onmousemove = (evt) => {
                console.log("test");
                const messageBody = { x: evt.clientX, y: evt.clientY };
                ws.send(JSON.stringify(messageBody));
            };
            ws.onmessage = (webSocketMessage) => {
                const messageBody = JSON.parse(webSocketMessage.data);
                const cursor = getOrCreateCursorFor(messageBody);
                cursor.style.transform = `translate(${messageBody.x}px,
${messageBody.y}px)`;
            };
            async function connectToServer() {
                const ws = new WebSocket('ws://localhost:8080');
                return new Promise((resolve, reject) => {
                    const timer = setInterval(() => {
                        if (ws.readyState === 1) {
                            clearInterval(timer)
                            resolve(ws);
                        }
                    }, 10);
                });
            }
            function getOrCreateCursorFor(messageBody) {
                const sender = messageBody.sender;
                const existing = document.querySelector(`[data-sender='${sender}']`);
                if (existing) {
                    return existing;
                }
                const template = document.getElementById('cursor');
                const cursor = template.content.firstElementChild.cloneNode(true);
                const svgPath = cursor.getElementsByTagName('path')[0];
                cursor.setAttribute('data-sender', sender);
                svgPath.setAttribute('fill', `hsl(${messageBody.color}, 50%, 50%)`);
                document.body.appendChild(cursor);
            }
            return cursor;
        })();

    </script>
</body>

</html>
